# OmniObject3D ingestion for the GEAL-pseudolabel pipeline.
#
# Flow:
#   prepare_omniobject3d.py  (scan blender_renders -> stage images/ + masks/ -> manifest.jsonl)
#     -> generate_sam3d.py   (reconstruct each staged image -> <recon_output>/<stem>/mesh.glb, ...)
#     -> generate_geal_pseudolabels.py  (GEAL -> vertex_pseudolabels.pt per object)
#     -> train_affordance.py (train on the pseudolabeled manifest)
#
# Only categories listed in `category_map` are kept; everything else in OmniObject3D is ignored.
# Verify/extend the maps against the actual downloaded folder names (the published docs do not list
# all 190 categories). Each kept category is queried with one canonical GEAL affordance for the MVP.

paths:
  # All OmniObject3D downloads + staged inputs + reconstructions live here (on /home, cmr2).
  data_root: /home/datasets/customDatasets/cmr2

omniobject3d:
  # <data_root>/<blender_renders_dir>/<category>/<object_id>/render/{images,depths,normals,transforms.json}
  blender_renders_dir: source
  raw_scans_dir: raw_scans
  staged_dir: sam3d_inputs           # where staged images/ + masks/ are written
  recon_output_dir: reconstructions  # where generate_sam3d.py writes <stem>/mesh.glb ...
  manifest_filename: manifest.jsonl
  views_per_object: 1                # reference views per object fed to SAM3D (1 = single view)
  split: train

  # OmniObject3D category folder name (lowercased) -> GEAL / 3D-AffordanceNet class.
  # GEAL only knows these 23 classes, so only overlapping categories yield meaningful pseudolabels.
  # VERIFIED against the actual 216 OmniObject3D-New blender_renders/ folders (OpenDataLab, 2026-06).
  # Only real folder names are kept. Removed keys that do not exist as folders (mug/teacup/water_bottle/
  # cap/bag/alarm_clock/trash_can/trashcan/display) — each is covered by a sibling folder below.
  # GEAL classes with NO OmniObject3D coverage are dropped entirely: Earphone (no earphone/headphone
  # folder) and Faucet (no faucet folder).
  # Optional unused GEAL classes with clean OmniObject3D matches you could add to broaden coverage:
  #   bed -> Bed, microwaveoven -> Microwave, cabinet -> StorageFurniture.
  category_map:
    bowl: Bowl
    cup: Mug
    bottle: Bottle
    knife: Knife
    scissor: Scissors        # OmniObject3D folder is singular "scissor" (not "scissors")
    hat: Hat
    handbag: Bag
    backpack: Bag
    clock: Clock
    vase: Vase
    dustbin: TrashCan
    chair: Chair
    laptop: Laptop
    keyboard: Keyboard
    monitor: Display
    table: Table

  # GEAL class -> the affordance/verb to query (one canonical affordance per class for the MVP).
  # Must be one of labeling.GEAL_AFFORDANCES.
  affordance_map:
    Bowl: contain
    Mug: contain
    Bottle: contain
    Knife: cut
    Scissors: cut
    Hat: wear
    Bag: grasp
    Clock: display
    Vase: contain
    TrashCan: contain
    Chair: sit
    Laptop: display
    Keyboard: press
    Earphone: listen
    Display: display
    Faucet: open
    Table: support
