# Conda env for affordance-prediction (tested on macOS Apple Silicon).
#
#   conda env create -f environment.yml
#   conda activate affordance
#
# PyTorch is installed via pip so torch and torchvision stay version-matched
# (mixing conda pytorch with pip torchvision causes import errors).

name: affordance
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - libjpeg-turbo
  - jpeg
  - pip:
      - -r requirements-pytorch.txt
      - -r requirements.txt
      - -e ".[notebooks,dev]"
