[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "affordance-prediction"
version = "0.1.0"
description = "Open-vocabulary affordance prediction from SAM3D reconstruction and VLM features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.6",
    "torchvision>=0.21",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "trimesh>=4.0",
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1.0",
    "tqdm>=4.65",
    "loguru>=0.7",
    "transformers>=4.36",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
