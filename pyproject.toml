[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reverb"
version = "0.1.0"
description = "ReVerb: verb-conditioned 3D affordance prediction on single-image SAM3D reconstructions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Keep compatible with SAM3D Docker (torch 2.5.1+cu121). Do not require 2.6+ or
    # `pip install -e .` inside sam3d will upgrade torch and break xformers / torchaudio.
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "trimesh>=4.0",
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1.0",
    "tqdm>=4.65",
    "loguru>=0.7",
    "transformers>=4.36",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "ipykernel>=6.0"]
gsplat = ["gsplat>=1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the labelling tool serves its web UI from src/labelling/static/
labelling = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
