[project]
name = "affordance-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.20.1",
    "hydra-core>=1.3.3",
    "numpy>=2.4.6",
    "torch>=2.12.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/affordance"]
